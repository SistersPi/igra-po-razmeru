const ROUNDS={size:['matryoshka','bear','apple'],width:['pot','basket'],length:['pencil','ribbon']};
const INSTR={size:['от самого большого к самому маленькому.','от самого маленького к самому большому.'],width:['от самого узкого к самому широкому.','от самого широкого к самому узкому.'],length:['от самого длинного к самому короткому.','от самого короткого к самому длинному.']};
let kind='size',stage=0,phase=0,selected=[],order=[],finished=false;const q=id=>document.getElementById(id);
const shuffled=()=>{let a=[0,1,2,3,4];for(let i=4;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.every((v,i)=>v===i)||a.every((v,i)=>v===4-i))return [3,0,4,1,2];return a};
function baseScale(s){return .42+s*.155}
function objectHTML(s,placed=false){let type=ROUNDS[kind][stage];let w=baseScale(s);let sty='';if(kind==='size'){sty=`transform:scale(${w});`;}else if(kind==='width'){sty=`transform:scaleX(${(.36+s*.18).toFixed(2)}) scaleY(.94);`;}else{sty=`transform:scaleX(${(.38+s*.17).toFixed(2)}) scaleY(.88);`;}let src=ASSETS[type];return `<img src="${src}" style="${sty}" draggable="false" alt="${type==='matryoshka'?'Матрёшка':type==='bear'?'Мишка':type==='apple'?'Яблоко':type==='pot'?'Горшок':type==='basket'?'Корзина':type==='pencil'?'Карандаш':'Лента'}">`}
function render(){q('items').className='items '+(kind==='length'?'length-mode':kind==='width'?'width-mode':'size-mode');q('round').textContent=`Раунд ${stage+1} из ${ROUNDS[kind].length} · этап ${phase+1} из 2`;q('direction').textContent=INSTR[kind][phase];document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));q('rowbox').innerHTML=Array.from({length:5},(_,i)=>`<div class="slot">${selected[i]===undefined?'':objectHTML(selected[i])}</div>${i<4?'<span class="arrow">➜</span>':''}`).join('');q('items').innerHTML=order.map(s=>`<button class="object" data-n="${s}" aria-label="Выбрать предмет ${s+1}" ${selected.includes(s)?'disabled':''}>${objectHTML(s)}</button>`).join('');document.querySelectorAll('.object').forEach(el=>el.addEventListener('click',()=>choose(Number(el.dataset.n))));q('dots').innerHTML=Array.from({length:5},(_,i)=>`<span class="dot ${i<selected.length?'on':''}"></span>`).join('');q('next').disabled=!finished;q('next').textContent=finished?(phase===0?'↔ Теперь наоборот':stage===ROUNDS[kind].length-1?'➜ Следующая игра':'✓ Следующий раунд'):'✓ Готово';}
function choose(v){if(finished||selected.includes(v))return;let correct=phase===0?(kind==='width'?selected.length:4-selected.length):(kind==='width'?4-selected.length:selected.length);if(v!==correct){q('message').textContent='Попробуй ещё! Сравни оставшиеся предметы.';q('message').classList.add('bad');return;}selected.push(v);q('message').classList.remove('bad');q('message').textContent='Верно!';if(selected.length===5){finished=true;if(phase===1&&stage===ROUNDS[kind].length-1){q('message').textContent='Класс! Все уровни пройдены, переходи к следующей игре.';q('message').classList.add('all-done');}else{q('message').textContent='Отлично! Все предметы стоят по порядку! ★';q('message').classList.remove('all-done');}}render();}
function restart(){selected=[];finished=false;order=shuffled();q('message').textContent='';q('message').classList.remove('all-done','bad');render();}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;stage=0;phase=0;restart()}));q('undo').addEventListener('click',()=>{if(selected.length){selected.pop();finished=false;render()}else restart()});q('next').addEventListener('click',()=>{if(!finished)return;if(phase===0){phase=1}else if(stage===ROUNDS[kind].length-1){const kinds=['size','width','length'];kind=kinds[(kinds.indexOf(kind)+1)%kinds.length];stage=0;phase=0}else{phase=0;stage++}restart()});q('home').addEventListener('click',()=>{kind='size';stage=0;phase=0;restart()});restart();
</script></body></html>
